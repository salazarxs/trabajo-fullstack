spring.application.name=tienda-backend
server.port=8080

# Conexion a MySQL (levantar con: docker compose up -d)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/tienda}
spring.datasource.username=${DB_USER:tienda}
spring.datasource.password=${DB_PASSWORD:tienda123}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
# la clave debe tener minimo 32 caracteres para HS256.
# En produccion se define con la variable de entorno JWT_SECRET; el valor por defecto es solo para desarrollo
jwt.secret=${JWT_SECRET:clave-secreta-de-la-tienda-online-duoc-dsy1104-2026}
# token de acceso: 1 hora
jwt.expiracion=3600000
# refresh token: 7 dias
jwt.expiracion-refresh=604800000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
